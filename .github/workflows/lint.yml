name: Lint, contracts, and package

on:
  push:
  pull_request:

permissions:
  contents: read

# Keep one current CI run per ref; stale package checks have no release value.
concurrency:
  group: aomark-listings-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every third-party action is pinned to the same reviewed revisions used by
# the Aomark for WooCommerce release workflow.

jobs:
  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run model contract tests
        run: php tests/model-contract.php

  javascript:
    name: JavaScript syntax and static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: npm run lint:js

      - name: Run static compatibility checks
        run: npm run test:static

  plugin-check:
    name: Deterministic package and WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Build and verify exact WordPress.org ZIP
        run: npm run check

      - name: Verify checksum and deterministic rebuild
        shell: bash
        run: |
          cd dist
          sha256sum --check aomark-listings.zip.sha256
          cd ..

          first="$(sha256sum dist/aomark-listings.zip)"
          npm run build
          second="$(sha256sum dist/aomark-listings.zip)"
          test "$first" = "$second"

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@18573eb38f13543484a1f095672dae3849a4fbb0 # v1.1.6
        with:
          build-dir: './.build/aomark-listings'
